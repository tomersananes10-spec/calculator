<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוקאפ B — קטלוג מאוחד: עולם כפילטר-על</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0ea5e9; --primary-light: #38bdf8; --primary-bg: #e0f2fe; --primary-dark: #0369a1;
  --digital: #8b5cf6; --digital-bg: #ede9fe; --digital-dark: #6d28d9;
  --navy: #0f172a; --slate: #64748b; --text: #1e293b; --text2: #475569; --text3: #94a3b8;
  --bg: #f8fafc; --surface: #fff; --border: #e2e8f0; --border2: #cbd5e1;
  --green: #10b981; --green-bg: #d1fae5; --amber: #f59e0b; --amber-bg: #fef3c7;
  --red: #ef4444; --red-bg: #fee2e2;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
.header { text-align: center; margin-bottom: 24px; }
.title { font-size: 36px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.subtitle { color: var(--text2); font-size: 15px; }
.count-line { color: var(--text2); font-size: 13px; margin-top: 4px; }

.search-row { display: flex; gap: 10px; align-items: center; max-width: 820px; margin: 0 auto 18px; }
.search-pill { flex: 1; display: flex; background: var(--surface); border: 1.5px solid var(--border); border-radius: 999px; padding: 4px 4px 4px 20px; transition: border-color 0.15s; }
.search-pill:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-bg); }
.search-pill input { flex: 1; border: none; outline: none; padding: 10px 0; font-family: inherit; font-size: 14px; background: transparent; }
.search-pill .icon { color: var(--text3); font-size: 18px; align-self: center; margin-left: 8px; }
.size-seg { display: flex; background: var(--surface); border: 1.5px solid var(--border); border-radius: 999px; padding: 3px; }
.size-seg button { padding: 8px 13px; background: transparent; border: none; border-radius: 999px; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--text2); font-weight: 600; }
.size-seg button.active { background: var(--navy); color: white; }

/* ===== פילטר-על: עולם ===== */
.world-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.world-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); padding: 9px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text2); font-family: inherit; transition: all 0.12s; }
.world-chip .num { background: var(--bg); padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.world-chip.active[data-world="all"] { background: var(--navy); border-color: var(--navy); color: white; }
.world-chip.active[data-world="tech"] { background: var(--primary); border-color: var(--primary); color: white; }
.world-chip.active[data-world="digital"] { background: var(--digital); border-color: var(--digital); color: white; }
.world-chip.active .num { background: rgba(255,255,255,0.22); color: white; }

.cluster-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.cluster-chip { background: var(--surface); border: 1.5px solid var(--border); padding: 7px 14px; border-radius: 999px; font-size: 12.5px; cursor: pointer; color: var(--text); font-weight: 500; transition: all 0.1s; display: inline-flex; align-items: center; gap: 7px; }
.cluster-chip:hover { border-color: var(--primary-light); }
.cluster-chip.active { background: var(--navy); color: white; border-color: var(--navy); }
.cluster-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cluster-chip .dot.d-tech { background: var(--primary); }
.cluster-chip .dot.d-digital { background: var(--digital); }
.cluster-chip .num { background: var(--bg); color: var(--text2); padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.cluster-chip.active .num { background: rgba(255,255,255,0.2); color: white; }

.results-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
.results-info .count { color: var(--text2); font-size: 13px; }
.results-info .count strong { color: var(--navy); font-size: 16px; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all 0.15s; position: relative; }
.card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.1); transform: translateY(-2px); }
.card-stripe { height: 4px; display: flex; }
.card-stripe span { flex: 1; }
.st-tech { background: var(--primary); }
.st-digital { background: var(--digital); }
.card-body { padding: 16px 18px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.card-name { font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.3; }
.world-badges { display: flex; gap: 4px; flex-shrink: 0; }
.world-badge { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.wb-tech { background: var(--primary-bg); color: var(--primary-dark); }
.wb-digital { background: var(--digital-bg); color: var(--digital-dark); }
.card-meta { font-size: 11px; color: var(--text3); margin-bottom: 12px; }
.card-clusters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.cl-tag { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 600; background: var(--bg); color: var(--text2); }
.card-summary { display: flex; gap: 16px; padding-top: 10px; border-top: 1px solid var(--border); }
.s-num { font-size: 18px; font-weight: 800; color: var(--navy); }
.s-lab { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.card-footer { display: flex; justify-content: space-between; padding: 10px 18px; background: var(--bg); border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); }
.status-active { color: var(--green); font-weight: 700; }
.status-warning { color: var(--amber); font-weight: 700; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); max-width: 760px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { padding: 24px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 16px; }
.modal-close { background: var(--bg); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text2); flex-shrink: 0; }
.modal-body { padding: 24px 28px; overflow-y: auto; flex: 1; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.detail-cell { background: var(--bg); border-radius: 8px; padding: 10px 14px; }
.detail-cell dt { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.detail-cell dd { font-size: 14px; color: var(--text); font-weight: 600; }
.world-section { margin-top: 20px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.world-section > h4 { padding: 10px 16px; font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; }
.world-section.ws-tech > h4 { background: var(--primary-bg); color: var(--primary-dark); }
.world-section.ws-digital > h4 { background: var(--digital-bg); color: var(--digital-dark); }
.world-section .inner { padding: 8px 16px 14px; }
.qual-group { margin-top: 10px; }
.qual-group h5 { font-size: 13px; color: var(--text3); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.qual-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 5px 4px; font-size: 13px; align-items: center; }
.qual-row .name { color: var(--text); }
.qual-row .size { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.qual-row .sku { font-size: 11px; color: var(--text3); font-family: monospace; }
.size-large { background: var(--primary-bg); color: var(--primary-dark); }
.size-small { background: var(--amber-bg); color: #b45309; }
.size-none { background: var(--bg); color: var(--text3); }

.empty { text-align: center; padding: 60px 20px; color: var(--text3); grid-column: 1/-1; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

@media (max-width: 980px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .detail-grid { grid-template-columns: 1fr; } .world-chip { padding: 8px 12px; font-size: 12.5px; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="title">ספקים זוכים</h1>
    <div class="subtitle">מכרז דיגטק 07-2023 · נספחים ד1 + ד2 · הודעה 16.2.19</div>
    <div class="count-line" id="countLine">—</div>
  </div>

  <div class="search-row">
    <div class="search-pill">
      <input type="text" id="search" placeholder="חיפוש חוצה-עולמות: ספק, התמחות, מק&quot;ט...">
      <span class="icon">🔍</span>
    </div>
    <div class="size-seg" id="sizeSeg">
      <button class="active" data-size="all">הכל</button>
      <button data-size="גדול">גדול</button>
      <button data-size="קטן">קטן</button>
      <button data-size="ל.ר">ל.ר</button>
    </div>
  </div>

  <div class="world-row" id="worldRow">
    <button class="world-chip active" data-world="all">🌐 כל העולמות <span class="num" id="numAll">—</span></button>
    <button class="world-chip" data-world="tech">🖥️ עולמות הטק <span class="num" id="numTech">—</span></button>
    <button class="world-chip" data-world="digital">🎨 עולמות הדיגיטל <span class="num" id="numDigital">—</span></button>
  </div>

  <div class="cluster-chips" id="clusterChips"></div>

  <div class="results-info">
    <div class="count"><strong id="cnt">—</strong> ספקים זוכים</div>
    <div class="count" id="cntDetail">—</div>
  </div>

  <div class="cards" id="results"></div>
</div>

<div class="modal-overlay" id="modal"></div>

<script>
let ROWS = [];           // כל השורות משני העולמות, כל שורה עם w: 'tech'|'digital'
let CLUSTERS = [];       // { name, world, suppliers }
const filters = { world: 'all', cluster: null, size: 'all', q: '' };
const WORLD_LABEL = { tech: 'טק', digital: 'דיגיטל' };

Promise.all([
  fetch('../suppliers/data.json').then(r => r.json()),
  fetch('digital-data.json').then(r => r.json()),
]).then(([tech, digital]) => {
  ROWS = [
    ...tech.rows.map(r => ({ ...r, w: 'tech' })),
    ...digital.rows.map(r => ({ ...r, w: 'digital' })),
  ];
  CLUSTERS = [
    ...tech.clusters.map(c => ({ ...c, w: 'tech' })),
    ...digital.clusters.map(c => ({ ...c, w: 'digital' })),
  ];
  document.getElementById('numAll').textContent = new Set(ROWS.map(r => r.s)).size;
  document.getElementById('numTech').textContent = tech.totals.suppliers;
  document.getElementById('numDigital').textContent = digital.totals.suppliers;
  init();
});

function init() {
  document.getElementById('worldRow').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    filters.world = btn.dataset.world;
    filters.cluster = null;
    document.querySelectorAll('#worldRow .world-chip').forEach(b => b.classList.toggle('active', b === btn));
    renderClusterChips(); render();
  });
  document.getElementById('search').addEventListener('input', e => { filters.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('sizeSeg').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') { filters.size = e.target.dataset.size; document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.toggle('active', b === e.target)); render(); }});
  renderClusterChips();
  render();
}

function renderClusterChips() {
  const el = document.getElementById('clusterChips');
  el.innerHTML = '';
  const visible = CLUSTERS.filter(c => filters.world === 'all' || c.w === filters.world);
  visible.forEach(c => {
    const chip = document.createElement('button');
    const key = c.w + '||' + c.name;
    chip.className = 'cluster-chip' + (filters.cluster === key ? ' active' : '');
    chip.innerHTML = `<span class="dot d-${c.w}"></span><span>${c.name}</span><span class="num">${c.suppliers}</span>`;
    chip.title = 'עולמות ה' + WORLD_LABEL[c.w];
    chip.onclick = () => { filters.cluster = filters.cluster === key ? null : key; renderClusterChips(); render(); };
    el.appendChild(chip);
  });
}

function getFiltered() {
  return ROWS.filter(r => {
    if (filters.world !== 'all' && r.w !== filters.world) return false;
    if (filters.cluster && (r.w + '||' + r.c) !== filters.cluster) return false;
    if (filters.size !== 'all' && r.sz !== filters.size) return false;
    if (filters.q) { const t = (r.s + ' ' + r.sp + ' ' + (r.k||'') + ' ' + (r.m||'')).toLowerCase(); if (!t.includes(filters.q)) return false; }
    return true;
  });
}

function render() {
  const rows = getFiltered();
  const sup = {};
  rows.forEach(r => { if (!sup[r.s]) sup[r.s] = { name: r.s, m: r.m, ag: r.ag, vf: r.vf, vt: r.vt, quals: [] }; sup[r.s].quals.push(r); });
  const arr = Object.values(sup).sort((a,b) => b.quals.length - a.quals.length);

  document.getElementById('cnt').textContent = arr.length;
  document.getElementById('cntDetail').textContent = `${new Set(rows.map(r=>r.sp)).size} התמחויות · ${rows.length} הרשאות`;
  document.getElementById('countLine').textContent = `${new Set(ROWS.map(r=>r.s)).size} ספקים בשני העולמות · ${CLUSTERS.length} אשכולות · ${new Set(ROWS.map(r=>r.sp)).size} התמחויות`;

  const el = document.getElementById('results');
  if (arr.length === 0) { el.innerHTML = '<div class="empty"><div class="icon">🔍</div>לא נמצאו ספקים בחיתוך זה<br>נסה להרחיב את הסינון</div>'; return; }

  el.innerHTML = arr.slice(0, 60).map(s => {
    const worlds = [...new Set(s.quals.map(q => q.w))];
    const clusters = [...new Set(s.quals.map(q => q.c))];
    const large = s.quals.filter(q => q.sz === 'גדול').length;
    const small = s.quals.filter(q => q.sz === 'קטן').length;
    const specCount = new Set(s.quals.map(q => q.sp)).size;
    const vt = new Date(s.vt); const days = Math.floor((vt - new Date()) / 86400000);
    const statusClass = days < 90 ? 'status-warning' : 'status-active';
    const statusText = days < 0 ? 'פג תוקף' : days < 90 ? `פג בעוד ${days} ימים` : `בתוקף עד ${vt.getFullYear()}`;
    const safe = s.name.replace(/"/g, '&quot;');
    return `<div class="card" data-name="${safe}">
      <div class="card-stripe">${worlds.map(w => `<span class="st-${w}"></span>`).join('')}</div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${s.name}</div>
          <div class="world-badges">${worlds.map(w => `<span class="world-badge wb-${w}">${w === 'tech' ? '🖥️ טק' : '🎨 דיגיטל'}</span>`).join('')}</div>
        </div>
        <div class="card-meta">${s.m ? `מנו"ף ${s.m}` : ''}${s.ag ? ` · הסכם ${s.ag}` : ''}</div>
        <div class="card-clusters">${clusters.slice(0,2).map(c => `<span class="cl-tag">${c}</span>`).join('')}${clusters.length > 2 ? `<span class="cl-tag" style="color:var(--text3)">+${clusters.length-2}</span>` : ''}</div>
        <div class="card-summary">
          <div><div class="s-num">${specCount}</div><div class="s-lab">התמחויות</div></div>
          <div><div class="s-num" style="color:var(--primary)">${large}</div><div class="s-lab">גדול</div></div>
          <div><div class="s-num" style="color:var(--amber)">${small}</div><div class="s-lab">קטן</div></div>
        </div>
      </div>
      <div class="card-footer">
        <span class="${statusClass}">● ${statusText}</span>
        <span>${formatDate(s.vf)}</span>
      </div>
    </div>`;
  }).join('');
  if (arr.length > 60) el.innerHTML += `<div class="empty">מציג 60 מתוך ${arr.length} · צמצם סינון לראות עוד</div>`;
  el.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openModal(c.dataset.name)));
}

function openModal(name) {
  const quals = ROWS.filter(r => r.s === name);
  const s = quals[0];
  const byWorld = {};
  quals.forEach(q => {
    if (!byWorld[q.w]) byWorld[q.w] = {};
    if (!byWorld[q.w][q.c]) byWorld[q.w][q.c] = [];
    byWorld[q.w][q.c].push(q);
  });
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal">
    <div class="modal-header">
      <div><h2 style="font-size:22px;color:var(--navy);margin-bottom:4px">${name}</h2>
      <div style="color:var(--text3);font-size:12px">${s.ag ? `הסכם ${s.ag}` : ''} ${s.m ? `· מנו"ף ${s.m}` : ''}</div></div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <dl class="detail-grid">
        <div class="detail-cell"><dt>תוקף ההסכם</dt><dd>${formatDate(s.vf)} — ${formatDate(s.vt)}</dd></div>
        <div class="detail-cell"><dt>סה"כ הרשאות</dt><dd>${quals.length}</dd></div>
        <div class="detail-cell"><dt>עולמות</dt><dd>${Object.keys(byWorld).map(w => WORLD_LABEL[w]).join(' + ')}</dd></div>
        <div class="detail-cell"><dt>התמחויות</dt><dd>${new Set(quals.map(q => q.sp)).size}</dd></div>
      </dl>
      ${Object.entries(byWorld).map(([w, byCluster]) => `
        <div class="world-section ws-${w}">
          <h4>${w === 'tech' ? '🖥️ עולמות הטק (נספח ד2)' : '🎨 עולמות הדיגיטל (נספח ד1)'}<span>${Object.values(byCluster).flat().length} הרשאות</span></h4>
          <div class="inner">
            ${Object.entries(byCluster).map(([c, qs]) => `
              <div class="qual-group">
                <h5>${c}<span style="color:var(--text3);font-weight:400">${qs.length}</span></h5>
                ${qs.map(q => `<div class="qual-row">
                  <span class="name">${q.sp}</span>
                  <span class="size size-${q.sz === 'גדול' ? 'large' : q.sz === 'קטן' ? 'small' : 'none'}">${q.sz || 'לא מוגדר'}</span>
                  <span class="sku">${q.k || ''}</span>
                </div>`).join('')}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
  m.classList.add('open');
  document.getElementById('modalClose').onclick = () => m.classList.remove('open');
  m.onclick = e => { if (e.target === m) m.classList.remove('open'); };
}

function formatDate(d) { if (!d) return '—'; const x = new Date(d); return `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()}`; }
</script>
</body>
</html>
