<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רובד 5 — מוקאפ B (לוח בקרה)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-bg:#eff6ff; --primary-light:#60a5fa;
  --navy:#0f172a; --text:#1e293b; --text2:#475569; --text3:#94a3b8;
  --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --border2:#cbd5e1;
  --green:#16a34a; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7; --red:#dc2626;
  --aws:#ff9900; --gcp:#4285f4; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl}
.wrap{max-width:1360px;margin:0 auto;padding:20px}

/* Hero KPI */
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:20px;padding:26px 30px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"☁";position:absolute;left:-10px;top:-30px;font-size:180px;opacity:.08}
.hero h1{margin:0;font-size:34px;font-weight:900}
.hero p{margin:6px 0 20px;opacity:.85;font-size:14px}
.heroKpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.hk{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 16px;cursor:pointer;transition:background .15s}
.hk:hover,.hk.active{background:rgba(255,255,255,.28)}
.hkNum{font-size:28px;font-weight:900;line-height:1}
.hkLabel{font-size:12px;opacity:.85;margin-top:5px}

.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:sticky;top:20px}
.sbTitle{font-size:13px;font-weight:800;color:var(--navy);margin:0 0 10px;display:flex;justify-content:space-between}
.sbClear{border:none;background:none;color:var(--primary);font-size:12px;cursor:pointer}
.catBtn{display:flex;align-items:center;gap:8px;width:100%;text-align:right;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer;font-family:inherit;font-size:13px}
.catBtn.on{border-color:var(--primary);background:var(--primary-bg);color:var(--primary-dark);font-weight:700}
.catBtn .n{margin-inline-start:auto;color:var(--text3);font-size:12px}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.searchWrap{position:relative;flex:1;min-width:200px}
.searchWrap input{width:100%;padding:11px 40px 11px 12px;border:1.5px solid var(--border2);border-radius:999px;font-family:inherit;font-size:14px;background:var(--surface)}
.searchWrap span{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--text3)}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--border2);background:var(--surface);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark)}
.tbtn.on{background:#f59e0b;border-color:#f59e0b;color:#fff}
.count{font-size:13px;color:var(--text3);margin-bottom:10px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative;border-top:3px solid var(--primary)}
.card.AWS{border-top-color:var(--aws)} .card.GCP{border-top-color:var(--gcp)}
.card:hover{box-shadow:0 12px 34px rgba(15,23,42,.13);transform:translateY(-2px)}
.cardTop{display:flex;align-items:center;gap:6px}
.sku{font-size:11px;font-family:monospace;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer}
.sku:hover{border-color:var(--primary);color:var(--primary)}
.iconBtn{width:26px;height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.iconBtn.on{background:#fef3c7;border-color:#f59e0b;color:#f59e0b}
.iconBtn.cmp.on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.cloudBadge{margin-inline-start:auto;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}
.cloudBadge.AWS{background:var(--aws)} .cloudBadge.GCP{background:var(--gcp)}
.cardName{font-size:15px;font-weight:800;color:var(--navy);line-height:1.3}
.cardMfr{font-size:12px;font-weight:700;color:var(--primary)}
.cardDesc{font-size:12.5px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.infoRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.discount{font-size:13px;font-weight:900;color:var(--green);background:var(--green-bg);padding:2px 9px;border-radius:6px}
.discount.byol{color:var(--amber);background:var(--amber-bg)}
.typeTag{font-size:10px;font-weight:800;color:var(--text2);border:1px solid var(--border2);padding:2px 7px;border-radius:5px}
.cardFoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:9px}
.footLink{font-size:12px;font-weight:700;color:var(--primary);text-decoration:none}
.detailsCta{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--primary)}

.cmpBar{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 18px;display:none;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:60}
.cmpBar.show{display:flex}
.cmpBar button{background:#fff;color:var(--navy);border:none;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer;font-family:inherit}
.cmpBar .clr{background:transparent;color:#cbd5e1;text-decoration:underline}

/* Chat drawer (right side) */
.fab{position:fixed;bottom:22px;left:22px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(37,99,235,.4);z-index:60}
.drawer{position:fixed;top:0;bottom:0;left:0;width:420px;max-width:100vw;background:var(--surface);box-shadow:20px 0 60px rgba(15,23,42,.2);transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;z-index:80}
.drawer.show{transform:translateX(0)}
.chatHead{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;padding:16px 18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.chatHead button{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer}
.chatBody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.miniCard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:6px;cursor:pointer}
.miniCard b{color:var(--navy)}
.chatInput{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border)}
.chatInput input{flex:1;padding:11px 13px;border:1.5px solid var(--border2);border-radius:999px;font-family:inherit;font-size:13px}
.chatInput button{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:0 20px;font-weight:800;cursor:pointer}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:70}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.cmpTable{width:100%;border-collapse:collapse;font-size:13px}
.cmpTable th,.cmpTable td{border:1px solid var(--border);padding:9px 11px;text-align:right;vertical-align:top}
.cmpTable th{background:var(--bg);font-weight:800;color:var(--navy)}
.closeX{float:left;border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}

@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static}.grid{grid-template-columns:repeat(2,1fr)}.heroKpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.heroKpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>רובד 5 · השוק הדיגיטלי</h1>
    <p>קטלוג שירותי הענן המאושרים לרכישה · LIBA · עודכן 10/2025</p>
    <div class="heroKpis" id="heroKpis"></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sbTitle"><span>קטגוריות</span><button class="sbClear" id="clearCat">נקה</button></div>
      <div id="cats"></div>
    </aside>
    <div>
      <div class="topbar">
        <div class="searchWrap"><span>🔍</span><input id="search" placeholder="חיפוש חכם..."></div>
        <button class="tbtn" id="favBtn">🔖 מועדפים</button>
        <button class="tbtn" id="exportBtn">📥 ייצוא</button>
      </div>
      <div class="count" id="count"></div>
      <div class="grid" id="results"></div>
    </div>
  </div>
</div>

<div class="cmpBar" id="cmpBar"><span id="cmpCount"></span><button id="cmpOpen">השווה ←</button><button class="clr" id="cmpClear">נקה</button></div>

<button class="fab" id="fab">✨ שיחה עם סייען AI</button>
<div class="drawer" id="drawer">
  <div class="chatHead"><span>✨ סייען רובד 5</span><button id="chatClose">✕</button></div>
  <div class="chatBody" id="chatBody"><div class="msg bot">שלום! ספר לי מה אתה צריך ואמצא שירותי ענן מתאימים מרובד 5.</div></div>
  <div class="chatInput"><input id="chatText" placeholder="כתוב הודעה..."><button id="chatSend">שלח</button></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalContent"></div></div>

<script>
let DATA=[], fav=new Set(JSON.parse(localStorage.getItem('roved5m:fav')||'[]')), cmp=new Set();
let cloud='all', favOnly=false, q='', catSel=new Set();
const CATS={security:['אבטחה','security','waf','הצפנה','firewall'],database:['database','בסיס נתונים','sql','דאטהבייס'],storage:['storage','אחסון','גיבוי','backup'],compute:['compute','שרת','vm','מחשוב'],ai_ml:['ai','ml','בינה','machine'],analytics:['analytics','אנליטיקה','bi','דוחות']};
const CATLBL={security:'🛡️ אבטחה',database:'🗄️ בסיסי נתונים',storage:'💾 אחסון',compute:'⚡ מחשוב',ai_ml:'🧠 AI/ML',analytics:'📊 אנליטיקה'};
function catOf(s){const t=(s.name+s.description+s.manufacturer).toLowerCase();for(const k in CATS){if(CATS[k].some(w=>t.includes(w)))return k;}return null;}

fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;initHero();initCats();render();});
function fmtDiscount(s){if(typeof s==='number')return{t:Math.round(s*100)+'%',byol:false};if(!s||/לא רלוונטי/.test(s))return{t:'BYOL / לפי רישיון',byol:true};return{t:String(s),byol:false};}
function initHero(){
  const aws=DATA.filter(s=>s.cloud==='AWS').length,gcp=DATA.length-DATA.filter(s=>s.cloud==='AWS').length;
  const saas=DATA.filter(s=>s.type==='SaaS').length;
  const k=[[DATA.length,'סה״כ שירותים','all'],[aws,'AWS','AWS'],[gcp,'GCP','GCP'],[saas,'SaaS','all'],[DATA.length-saas,'Non-SaaS','all']];
  document.getElementById('heroKpis').innerHTML=k.map(x=>`<div class="hk" data-k="${x[2]}"><div class="hkNum">${x[0]}</div><div class="hkLabel">${x[1]}</div></div>`).join('');
  document.querySelectorAll('.hk').forEach(el=>el.onclick=()=>{cloud=cloud===el.dataset.k?'all':el.dataset.k;render();});
}
function initCats(){
  const counts={};Object.keys(CATLBL).forEach(k=>counts[k]=0);DATA.forEach(s=>{const c=catOf(s);if(c)counts[c]++;});
  document.getElementById('cats').innerHTML=Object.keys(CATLBL).map(k=>`<button class="catBtn" data-cat="${k}">${CATLBL[k]}<span class="n">${counts[k]}</span></button>`).join('');
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;catSel.has(c)?catSel.delete(c):catSel.add(c);render();});
}
document.getElementById('clearCat').onclick=()=>{catSel.clear();render();};
function filtered(){return DATA.filter(s=>{
  if(cloud!=='all'&&s.cloud!==cloud)return false;
  if(favOnly&&!fav.has(s.id))return false;
  if(catSel.size>0){const c=catOf(s);if(!c||!catSel.has(c))return false;}
  if(q){const t=(s.name+s.manufacturer+s.description+s.id+s.provider).toLowerCase();if(!t.includes(q.toLowerCase()))return false;}
  return true;});}
function render(){
  document.querySelectorAll('.hk').forEach(el=>el.classList.toggle('active',el.dataset.k===cloud&&cloud!=='all'));
  document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',catSel.has(b.dataset.cat)));
  document.getElementById('favBtn').classList.toggle('on',favOnly);
  const list=filtered();
  document.getElementById('count').textContent=list.length+' תוצאות';
  document.getElementById('results').innerHTML=list.map(cardHtml).join('');
  bindCards();updCmpBar();
}
function cardHtml(s){const d=fmtDiscount(s.discount);const isFav=fav.has(s.id),isCmp=cmp.has(s.id);const hasLink=s.price_link&&/http/.test(s.price_link);
  return `<div class="card ${s.cloud}" data-id="${s.id}">
    <div class="cardTop"><span class="sku" data-copy="${s.id}">📋 ${s.id}</span>
      <button class="iconBtn fav ${isFav?'on':''}" data-fav="${s.id}">${isFav?'★':'☆'}</button>
      <button class="iconBtn cmp ${isCmp?'on':''}" data-cmp="${s.id}">⇄</button>
      <span class="cloudBadge ${s.cloud}">${s.cloud}</span></div>
    <div class="cardName">${s.name}</div><div class="cardMfr">${s.manufacturer||''}</div>
    <div class="cardDesc">${s.description||''}</div>
    <div class="infoRow"><span class="discount ${d.byol?'byol':''}">${d.byol?d.t:'הנחה '+d.t}</span><span class="typeTag">${s.type}</span></div>
    <div class="cardFoot">${hasLink?'<a class="footLink" href="#" onclick="event.stopPropagation();return false">⧉ מחירון</a>':''}<a class="footLink" href="#" onclick="event.stopPropagation();return false">📧 קשר</a><span class="detailsCta">פרטים מלאים ←</span></div>
  </div>`;}
function bindCards(){
  document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=e=>{e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(el.dataset.copy);el.textContent='✓ הועתק';setTimeout(()=>el.textContent='📋 '+el.dataset.copy,1200);});
  document.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('roved5m:fav',JSON.stringify([...fav]));render();});
  document.querySelectorAll('[data-cmp]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.cmp;if(cmp.has(id))cmp.delete(id);else{if(cmp.size>=4){alert('עד 4');return;}cmp.add(id);}render();});
  document.querySelectorAll('.card').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav],[data-cmp],[data-copy],.footLink'))return;openDetails(el.dataset.id);});
}
function updCmpBar(){document.getElementById('cmpBar').classList.toggle('show',cmp.size>0);document.getElementById('cmpCount').textContent=cmp.size+' נבחרו להשוואה';}
document.getElementById('cmpClear').onclick=()=>{cmp.clear();render();};
document.getElementById('cmpOpen').onclick=()=>{const items=[...cmp].map(id=>DATA.find(s=>s.id===id));const rows=[['מק״ט','id'],['שם','name'],['יצרן','manufacturer'],['ספק','provider'],['ענן','cloud'],['סוג','type'],['הנחה','discount'],['הערות','notes']];let h=`<button class="closeX" onclick="closeModal()">✕</button><h3>השוואה (${items.length})</h3><table class="cmpTable"><tbody>`;rows.forEach(([l,k])=>{h+=`<tr><th>${l}</th>`+items.map(s=>{let v=s[k];if(k==='discount')v=fmtDiscount(v).t;return`<td>${v||'—'}</td>`;}).join('')+'</tr>';});h+='</tbody></table>';showModal(h);};
function openDetails(id){const s=DATA.find(x=>x.id===id);if(!s)return;const d=fmtDiscount(s.discount);showModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${s.name}</h3><p style="color:var(--primary);font-weight:700">${s.manufacturer||''} · ${s.provider||''}</p><p style="color:var(--text2)">${s.description||''}</p><p><b>מק״ט:</b> ${s.id} · <b>הנחה:</b> ${d.t} · <b>אישור:</b> ${s.approval_date||'—'}</p>${s.notes?`<p style="background:var(--amber-bg);padding:10px;border-radius:8px;white-space:pre-wrap">${s.notes}</p>`:''}`);}
function showModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('overlay').classList.add('show');}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
document.getElementById('search').oninput=e=>{q=e.target.value;render();};
document.getElementById('favBtn').onclick=()=>{favOnly=!favOnly;render();};
document.getElementById('exportBtn').onclick=()=>alert('ייצוא Excel/PDF — ימומש בקוד האמיתי');
const fab=document.getElementById('fab'),drawer=document.getElementById('drawer');
fab.onclick=()=>{drawer.classList.add('show');fab.style.display='none';};
document.getElementById('chatClose').onclick=()=>{drawer.classList.remove('show');fab.style.display='';};
function chatSend(){const inp=document.getElementById('chatText'),body=document.getElementById('chatBody');const t=inp.value.trim();if(!t)return;body.innerHTML+=`<div class="msg user">${t}</div>`;inp.value='';setTimeout(()=>{const hits=DATA.filter(s=>(s.name+s.description+s.manufacturer).toLowerCase().includes(t.toLowerCase())).slice(0,3);let h=`<div class="msg bot">מצאתי ${hits.length} שירותים:`;hits.forEach(s=>h+=`<div class="miniCard" onclick="openDetails('${s.id}')"><b>${s.name}</b><br>${s.manufacturer||''} · ${s.cloud}</div>`);h+='</div>';body.innerHTML+=h;body.scrollTop=body.scrollHeight;},400);body.scrollTop=body.scrollHeight;}
document.getElementById('chatSend').onclick=chatSend;
document.getElementById('chatText').onkeydown=e=>{if(e.key==='Enter')chatSend();};
</script>
</body>
</html>
