<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רובד 5 — מוקאפ A (מרקטפלייס)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-bg:#eff6ff; --primary-light:#60a5fa;
  --navy:#0f172a; --text:#1e293b; --text2:#475569; --text3:#94a3b8;
  --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --border2:#cbd5e1;
  --green:#16a34a; --green-bg:#dcfce7; --amber:#b45309; --amber-bg:#fef3c7; --red:#dc2626; --red-bg:#fee2e2;
  --aws:#ff9900; --gcp:#4285f4; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl}
.wrap{max-width:1360px;margin:0 auto;padding:20px}

/* Brand row */
.brandRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:12px}
.brandLogo{font-size:26px;font-weight:900;color:var(--primary);letter-spacing:.5px}
.brandSub{font-size:13px;color:var(--text2)}
.updated{font-size:12px;color:var(--text3)}

/* KPI bar */
.kpiBar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.kpiNum{font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.kpiLabel{font-size:12px;color:var(--text3);margin-top:6px}
.kpiTag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--text3)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--primary-bg);border-color:var(--primary);color:var(--primary-dark)}
.tbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tbtn.ai{background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;color:#fff}
.spacer{flex:1}
.viewToggle{display:flex;border:1.5px solid var(--border2);border-radius:10px;overflow:hidden}
.viewToggle button{border:none;background:var(--surface);padding:8px 12px;cursor:pointer;font-size:15px}
.viewToggle button.on{background:var(--primary);color:#fff}
.searchWrap{position:relative;flex:1;min-width:220px}
.searchWrap input{width:100%;padding:10px 38px 10px 12px;border:1.5px solid var(--border2);border-radius:999px;font-family:inherit;font-size:14px}
.searchWrap span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* Filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.chip{padding:7px 16px;border-radius:999px;border:1.5px solid var(--border2);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.fav.on{background:#f59e0b;border-color:#f59e0b}

.count{font-size:13px;color:var(--text3);margin-bottom:10px}

/* Card grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s;cursor:pointer}
.card:hover{box-shadow:0 10px 30px rgba(15,23,42,.12);transform:translateY(-2px)}
.cardTop{display:flex;align-items:center;gap:6px}
.sku{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:monospace;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer}
.sku:hover{border-color:var(--primary);color:var(--primary)}
.iconBtn{width:26px;height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.iconBtn:hover{border-color:var(--primary);color:var(--primary)}
.iconBtn.on{background:#fef3c7;border-color:#f59e0b;color:#f59e0b}
.iconBtn.cmp.on{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.cloudBadge{margin-inline-start:auto;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}
.cloudBadge.AWS{background:var(--aws)}
.cloudBadge.GCP{background:var(--gcp)}
.cardName{font-size:15px;font-weight:800;color:var(--navy);line-height:1.3}
.cardMfr{font-size:12px;font-weight:700;color:var(--primary)}
.cardDesc{font-size:12.5px;color:var(--text2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.infoRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--bg);border-radius:8px;padding:7px 9px;margin-top:auto}
.discount{font-size:13px;font-weight:900;color:var(--green);background:var(--green-bg);padding:2px 9px;border-radius:6px}
.discount.byol{color:var(--amber);background:var(--amber-bg)}
.typeTag{font-size:10px;font-weight:800;color:var(--text2);border:1px solid var(--border2);padding:2px 7px;border-radius:5px}
.cardFoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:9px}
.footLink{font-size:12px;font-weight:700;color:var(--primary);text-decoration:none}
.detailsCta{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--primary)}

/* Compare bar */
.cmpBar{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 18px;display:none;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:60}
.cmpBar.show{display:flex}
.cmpBar button{background:#fff;color:var(--navy);border:none;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer;font-family:inherit}
.cmpBar .clr{background:transparent;color:#cbd5e1;text-decoration:underline}

/* Chat FAB */
.fab{position:fixed;bottom:22px;left:22px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(37,99,235,.4);z-index:60}
.chatPanel{position:fixed;bottom:22px;left:22px;width:380px;max-width:calc(100vw - 44px);height:520px;max-height:calc(100vh - 44px);background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.3);display:none;flex-direction:column;overflow:hidden;z-index:61}
.chatPanel.show{display:flex}
.chatHead{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;padding:14px 16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.chatHead button{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer}
.chatBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.miniCard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:6px;cursor:pointer}
.miniCard b{color:var(--navy)}
.chatInput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--surface)}
.chatInput input{flex:1;padding:10px 12px;border:1.5px solid var(--border2);border-radius:999px;font-family:inherit;font-size:13px}
.chatInput button{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:0 18px;font-weight:800;cursor:pointer}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:70}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 14px}
.cmpTable{width:100%;border-collapse:collapse;font-size:13px}
.cmpTable th,.cmpTable td{border:1px solid var(--border);padding:9px 11px;text-align:right;vertical-align:top}
.cmpTable th{background:var(--bg);font-weight:800;color:var(--navy)}
.closeX{float:left;border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}

@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.kpiBar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.kpiBar{grid-template-columns:repeat(2,1fr)}.brandSub{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandRow">
    <div class="brand"><span class="brandLogo">LIBA</span><span class="brandSub">רובד 5 — קטלוג שירותי ענן מאושרים לרכישה</span></div>
    <span class="updated" id="updated">עודכן: 10/2025</span>
  </div>

  <div class="kpiBar" id="kpiBar"></div>

  <div class="toolbar">
    <div class="searchWrap"><span>🔍</span><input id="search" placeholder="חיפוש חכם — שם שירות, יצרן, מק״ט, ספק..."></div>
    <div class="spacer"></div>
    <button class="tbtn" id="favBtn">🔖 מועדפים</button>
    <button class="tbtn" id="exportBtn">📥 ייצוא</button>
    <div class="viewToggle"><button class="on" data-v="grid">▦</button><button data-v="table">▤</button></div>
    <button class="tbtn ai" id="chatBtn">✨ סייען AI</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="results"></div>
</div>

<div class="cmpBar" id="cmpBar">
  <span id="cmpCount">0 נבחרו להשוואה</span>
  <button id="cmpOpen">השווה ←</button>
  <button class="clr" id="cmpClear">נקה</button>
</div>

<button class="fab" id="fab">✨ שיחה עם סייען AI</button>
<div class="chatPanel" id="chatPanel">
  <div class="chatHead"><span>✨ סייען רובד 5</span><button id="chatClose">✕</button></div>
  <div class="chatBody" id="chatBody">
    <div class="msg bot">שלום! ספר לי מה אתה צריך ואמצא לך שירותי ענן מתאימים מרובד 5. למשל: "אבטחה לדאטה רגיש" או "כלי ETL".</div>
  </div>
  <div class="chatInput"><input id="chatText" placeholder="כתוב הודעה..."><button id="chatSend">שלח</button></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalContent"></div></div>

<script>
let DATA=[], fav=new Set(JSON.parse(localStorage.getItem('roved5m:fav')||'[]')), cmp=new Set();
let cloud='all', type='all', favOnly=false, view='grid', q='';

fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;initKpi();initChips();render();});

function fmtDiscount(s){
  if(typeof s==='number') return {t:Math.round(s*100)+'%',byol:false};
  if(!s||/לא רלוונטי/.test(s)) return {t:'BYOL / לפי רישיון',byol:true};
  return {t:String(s),byol:false};
}
function initKpi(){
  const aws=DATA.filter(s=>s.cloud==='AWS').length, gcp=DATA.filter(s=>s.cloud==='GCP').length;
  const saas=DATA.filter(s=>s.type==='SaaS').length, non=DATA.length-saas;
  const kpis=[
    {n:DATA.length,l:'סה״כ שירותים',tag:'הכל',k:'all'},
    {n:aws,l:'שירותי AWS',tag:'AMAZON',k:'AWS'},
    {n:gcp,l:'שירותי GCP',tag:'GOOGLE',k:'GCP'},
    {n:saas,l:'SaaS',tag:'מודל',k:'SaaS'},
    {n:non,l:'Non-SaaS',tag:'מודל',k:'non-SaaS'},
  ];
  document.getElementById('kpiBar').innerHTML=kpis.map(x=>
    `<div class="kpi" data-k="${x.k}"><span class="kpiTag">${x.tag}</span><div class="kpiNum">${x.n}</div><div class="kpiLabel">${x.l}</div></div>`).join('');
  document.querySelectorAll('.kpi').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    if(k==='AWS'||k==='GCP'){cloud=cloud===k?'all':k;type='all';}
    else if(k==='SaaS'||k==='non-SaaS'){type=type===k?'all':k;cloud='all';}
    else {cloud='all';type='all';}
    syncChips();render();
  });
}
function initChips(){
  const c=document.getElementById('chips');
  c.innerHTML=`
    <button class="chip" data-c="all">הכל</button>
    <button class="chip" data-c="AWS">AWS</button>
    <button class="chip" data-c="GCP">GCP</button>
    <button class="chip" data-t="all">כל הסוגים</button>
    <button class="chip" data-t="SaaS">SaaS</button>
    <button class="chip" data-t="non-SaaS">non-SaaS</button>
    <button class="chip fav" id="favChip">🔖 מועדפים (0)</button>`;
  c.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cloud=b.dataset.c;render();});
  c.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;render();});
  document.getElementById('favChip').onclick=()=>{favOnly=!favOnly;render();};
  syncChips();
}
function syncChips(){
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===cloud));
  document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
  const fc=document.getElementById('favChip'); if(fc){fc.classList.toggle('on',favOnly);fc.textContent=`🔖 מועדפים (${fav.size})`;}
  document.querySelectorAll('.kpi').forEach(el=>{
    const k=el.dataset.k;
    el.classList.toggle('active',(k==='AWS'||k==='GCP')&&cloud===k||(k==='SaaS'||k==='non-SaaS')&&type===k);
  });
}
function filtered(){
  return DATA.filter(s=>{
    if(cloud!=='all'&&s.cloud!==cloud)return false;
    if(type!=='all'&&s.type!==type)return false;
    if(favOnly&&!fav.has(s.id))return false;
    if(q){const t=(s.name+s.manufacturer+s.description+s.id+s.provider).toLowerCase();if(!t.includes(q.toLowerCase()))return false;}
    return true;
  });
}
function render(){
  syncChips();
  const list=filtered();
  document.getElementById('count').textContent=list.length+' תוצאות';
  const R=document.getElementById('results');
  if(view==='table'){R.innerHTML=tableHtml(list);}
  else{R.innerHTML='<div class="grid">'+list.map(cardHtml).join('')+'</div>';}
  bindCards();
  updCmpBar();
}
function cardHtml(s){
  const d=fmtDiscount(s.discount);
  const isFav=fav.has(s.id), isCmp=cmp.has(s.id);
  const hasLink=s.price_link&&/http/.test(s.price_link);
  return `<div class="card" data-id="${s.id}">
    <div class="cardTop">
      <span class="sku" data-copy="${s.id}" title="העתק מק״ט">📋 ${s.id}</span>
      <button class="iconBtn fav ${isFav?'on':''}" data-fav="${s.id}" title="מועדף">${isFav?'★':'☆'}</button>
      <button class="iconBtn cmp ${isCmp?'on':''}" data-cmp="${s.id}" title="השוואה">⇄</button>
      <span class="cloudBadge ${s.cloud}">${s.cloud}</span>
    </div>
    <div class="cardName">${s.name}</div>
    <div class="cardMfr">${s.manufacturer||''}</div>
    <div class="cardDesc">${s.description||''}</div>
    <div class="infoRow"><span class="discount ${d.byol?'byol':''}">${d.byol?d.t:'הנחה '+d.t}</span><span class="typeTag">${s.type}</span></div>
    <div class="cardFoot">
      ${hasLink?`<a class="footLink" href="#" onclick="event.stopPropagation();return false">⧉ מחירון</a>`:''}
      <a class="footLink" href="#" onclick="event.stopPropagation();return false">📧 קשר</a>
      <span class="detailsCta">פרטים מלאים ←</span>
    </div>
  </div>`;
}
function tableHtml(list){
  return `<table class="cmpTable"><thead><tr><th>מק״ט</th><th>שם</th><th>יצרן</th><th>ענן</th><th>סוג</th><th>הנחה</th><th></th></tr></thead><tbody>`+
    list.map(s=>{const d=fmtDiscount(s.discount);return `<tr data-id="${s.id}">
      <td style="font-family:monospace">${s.id}</td><td><b>${s.name}</b></td><td>${s.manufacturer||''}</td>
      <td><span class="cloudBadge ${s.cloud}">${s.cloud}</span></td><td>${s.type}</td><td>${d.byol?d.t:d.t}</td>
      <td><button class="iconBtn fav ${fav.has(s.id)?'on':''}" data-fav="${s.id}">${fav.has(s.id)?'★':'☆'}</button></td></tr>`;}).join('')+`</tbody></table>`;
}
function bindCards(){
  document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=e=>{e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(el.dataset.copy);el.textContent='✓ הועתק';setTimeout(()=>el.textContent='📋 '+el.dataset.copy,1200);});
  document.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('roved5m:fav',JSON.stringify([...fav]));render();});
  document.querySelectorAll('[data-cmp]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.cmp;if(cmp.has(id))cmp.delete(id);else{if(cmp.size>=4){alert('עד 4 להשוואה');return;}cmp.add(id);}render();});
  document.querySelectorAll('.card,[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav],[data-cmp],[data-copy],.footLink'))return;openDetails(el.dataset.id);});
}
function updCmpBar(){
  const bar=document.getElementById('cmpBar');
  bar.classList.toggle('show',cmp.size>0);
  document.getElementById('cmpCount').textContent=cmp.size+' נבחרו להשוואה';
}
document.getElementById('cmpClear').onclick=()=>{cmp.clear();render();};
document.getElementById('cmpOpen').onclick=()=>openCompare();
function openCompare(){
  const items=[...cmp].map(id=>DATA.find(s=>s.id===id));
  const rows=[['מק״ט','id'],['שם','name'],['יצרן','manufacturer'],['ספק','provider'],['ענן','cloud'],['סוג','type'],['הנחה','discount'],['הערות','notes']];
  let h=`<button class="closeX" onclick="closeModal()">✕</button><h3>השוואת שירותים (${items.length})</h3><table class="cmpTable"><tbody>`;
  rows.forEach(([lbl,k])=>{h+=`<tr><th>${lbl}</th>`+items.map(s=>{let v=s[k];if(k==='discount')v=fmtDiscount(v).t;return `<td>${v||'—'}</td>`;}).join('')+`</tr>`;});
  h+='</tbody></table>';
  showModal(h);
}
function openDetails(id){
  const s=DATA.find(x=>x.id===id);if(!s)return;const d=fmtDiscount(s.discount);
  showModal(`<button class="closeX" onclick="closeModal()">✕</button>
    <h3>${s.name}</h3>
    <p style="color:var(--primary);font-weight:700;margin:0 0 10px">${s.manufacturer||''} · ${s.provider||''}</p>
    <p style="color:var(--text2)">${s.description||''}</p>
    <div class="infoRow" style="display:inline-flex"><span class="discount ${d.byol?'byol':''}">${d.byol?d.t:'הנחה '+d.t}</span><span class="typeTag">${s.type}</span><span class="cloudBadge ${s.cloud}">${s.cloud}</span></div>
    <p style="margin-top:14px"><b>מק״ט:</b> ${s.id} · <b>אישור:</b> ${s.approval_date||'—'}</p>
    ${s.notes?`<p style="background:var(--amber-bg);padding:10px;border-radius:8px;white-space:pre-wrap">${s.notes}</p>`:''}`);
}
function showModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('overlay').classList.add('show');}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};

document.getElementById('search').oninput=e=>{q=e.target.value;render();};
document.getElementById('favBtn').onclick=()=>{favOnly=!favOnly;render();};
document.querySelectorAll('.viewToggle button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('.viewToggle button').forEach(x=>x.classList.toggle('on',x===b));render();});
document.getElementById('exportBtn').onclick=()=>alert('ייצוא Excel/PDF — ימומש בקוד האמיתי');

// Chat (visual mock)
const fab=document.getElementById('fab'),panel=document.getElementById('chatPanel');
fab.onclick=()=>{panel.classList.add('show');fab.style.display='none';};
document.getElementById('chatBtn').onclick=()=>{panel.classList.add('show');fab.style.display='none';};
document.getElementById('chatClose').onclick=()=>{panel.classList.remove('show');fab.style.display='';};
function chatSend(){
  const inp=document.getElementById('chatText'),body=document.getElementById('chatBody');
  const t=inp.value.trim();if(!t)return;
  body.innerHTML+=`<div class="msg user">${t}</div>`;inp.value='';
  setTimeout(()=>{
    const hits=DATA.filter(s=>(s.name+s.description+s.manufacturer).toLowerCase().includes(t.toLowerCase())).slice(0,3);
    let h=`<div class="msg bot">מצאתי ${hits.length} שירותים שעשויים להתאים:`;
    hits.forEach(s=>h+=`<div class="miniCard" onclick="openDetails('${s.id}')"><b>${s.name}</b><br>${s.manufacturer||''} · ${s.cloud}</div>`);
    h+=`</div>`;body.innerHTML+=h;body.scrollTop=body.scrollHeight;
  },400);
  body.scrollTop=body.scrollHeight;
}
document.getElementById('chatSend').onclick=chatSend;
document.getElementById('chatText').onkeydown=e=>{if(e.key==='Enter')chatSend();};
</script>
</body>
</html>
